<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Double Take</title>
  <desc id="desc">One line, printed twice. A two-reading party game.</desc>
  <rect width="1200" height="630" fill="#1b1626"/>
  <g transform="translate(92 92) scale(2.5)">
    <rect width="128" height="128" rx="28" fill="#241d31"/>
    <rect x="19" y="35" width="84" height="31" rx="15.5" fill="#ff5a45" transform="rotate(-4 61 50.5)"/>
    <rect x="25" y="61" width="84" height="31" rx="15.5" fill="#4f6bff" fill-opacity=".9" transform="rotate(4 67 76.5)"/>
  </g>
  <text x="480" y="275" fill="#fff8e7" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-4">DOUBLE TAKE</text>
  <text x="486" y="355" fill="#c9c0d1" font-family="Arial, Helvetica, sans-serif" font-size="34">One line. Two impressions.</text>
  <path d="M486 405h490" stroke="#ff5a45" stroke-width="18" stroke-linecap="round"/>
  <path d="M502 427h490" stroke="#4f6bff" stroke-width="18" stroke-linecap="round" opacity=".9"/>
</svg>
