name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format, lint, typecheck, and test
        run: pnpm check
      - name: Build the Worker once
        env:
          APP_RELEASE: ${{ github.sha }}
          APP_ENVIRONMENT: production
          SENTRY_ORG: misty-step
          SENTRY_PROJECT: double-take
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then test -n "$SENTRY_AUTH_TOKEN"; fi
          node scripts/build-worker.mjs
      - name: Exercise the packaged Worker
        env:
          APP_RELEASE: ${{ github.sha }}
        run: node scripts/smoke-worker.mjs
      - name: Package the tested artifact
        run: |
          tar -czf worker.tar.gz .open-next wrangler.jsonc
          sha256sum worker.tar.gz > worker.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ github.sha }}
          path: |
            worker.tar.gz
            worker.tar.gz.sha256
          retention-days: 14

  preview-rollback:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: worker-${{ github.sha }}
      - name: Rehearse native rollback on a disposable Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_RELEASE: ${{ github.sha }}
        run: |
          sha256sum --check worker.tar.gz.sha256
          tar -xzf worker.tar.gz
          node scripts/prove-rollback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-rollback-${{ github.sha }}
          path: preview-rollback.json
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: double-take-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: worker-${{ github.sha }}
      - name: Promote the tested artifact; recover on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          APP_RELEASE: ${{ github.sha }}
        run: |
          sha256sum --check worker.tar.gz.sha256
          tar -xzf worker.tar.gz
          node scripts/deploy-worker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ github.sha }}
          path: deployment.json
          if-no-files-found: ignore

  report-failure:
    if: failure() && github.event_name == 'push'
    needs: [check, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node scripts/report-release-failure.mjs
