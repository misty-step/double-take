name: Roll back Worker code
on:
  workflow_dispatch:
    inputs:
      version:
        description: Previously verified Cloudflare Worker version UUID (not a source SHA)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: double-take-production
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore existing version and read back provider plus public journey
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROLLBACK_VERSION: ${{ inputs.version }}
        run: node scripts/deploy-worker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-${{ github.run_id }}
          path: deployment.json
          if-no-files-found: ignore
      - name: Report failure through the existing Sentry incident path
        if: failure()
        run: node scripts/report-release-failure.mjs
